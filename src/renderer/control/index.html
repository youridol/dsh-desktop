<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>DSH 控制面板</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header id="titlebar">
    <span class="title">DSH 控制面板</span>
    <button id="closeBtn" title="关闭">✕</button>
  </header>

  <nav id="tabs">
    <button class="tab active" data-tab="dashboard">仪表盘</button>
    <button class="tab" data-tab="plugins">插件</button>
    <button class="tab" data-tab="skills">Skills</button>
    <button class="tab" data-tab="versions">版本</button>
    <button class="tab" data-tab="status">日志与状态</button>
    <button class="tab" data-tab="settings">设置</button>
  </nav>

  <main id="content">
    <section id="pane-dashboard" class="pane active"></section>
    <section id="pane-plugins" class="pane"></section>
    <section id="pane-skills" class="pane"></section>
    <section id="pane-versions" class="pane"></section>
    <section id="pane-status" class="pane"></section>
    <section id="pane-settings" class="pane"></section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="./app.js"></script>
</body>
</html>
