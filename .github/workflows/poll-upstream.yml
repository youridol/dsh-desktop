name: Poll upstream

# 上游巡检（每小时 + 手动双通道）：deepseek-ai/deepseek-harness 是固定更新通道。
#   上游新 Release（tag 规范化后本仓库无对应 tag）→ 以 main 代码调 build-and-release.yml 发 v{V}；
#   上游仅默认分支有新 commit → 发 v{V}-dev-<sha7> 候选版（prerelease）；
#   无变化 → 幂等退出（不触发构建）。
#
# GitHub Actions 无法订阅他人仓库事件，故用定时轮询 + “本仓库 tag 存在性”作为幂等真相源：
# 同一版本连跑多次调度，只有第一次发版，后续轮询发现 tag 已存在即跳过（连 tag 也无需重复查询）。

on:
  schedule:
    # 每小时 37 分巡检（避开整点高峰；GitHub 调度存在分钟级延迟，属正常）
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "无变化也强制重建（目标 tag 已存在时由 build-and-release 覆盖资产）"
        type: boolean
        default: false
      release_mode:
        description: "auto（按上游状态自动决策）| version（强制正式版）| dev（强制候选版）"
        type: string
        default: "auto"
      override_version:
        description: "手动指定发版版本 V（如 0.1.1-rc.2）；空 = 取上游最新 Release tag 规范化结果"
        type: string
        default: ""

concurrency:
  # 轮询本身允许被新调度抢占（旧巡检结果已过时）；构建队列在 build-and-release 内串行
  group: poll-upstream
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
      mode: ${{ steps.decide.outputs.mode }}
      version: ${{ steps.decide.outputs.version }}
      sha: ${{ steps.decide.outputs.sha }}
      upstream_tag: ${{ steps.decide.outputs.upstream_tag }}
      upstream_prerelease: ${{ steps.decide.outputs.upstream_prerelease }}
      notes: ${{ steps.decide.outputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare upstream with this repo's tags
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          RELEASE_MODE_INPUT: ${{ inputs.release_mode }}
          OVERRIDE_VERSION: ${{ inputs.override_version }}
        run: |
          set -euo pipefail

          # 注意：不用 /releases/latest —— 该端点会跳过 prerelease，DSH 的 rc 版会 404。
          # 取 releases 列表首条（最近一次 Release，含 rc/alpha/beta）。
          REL_JSON=$(gh api "repos/deepseek-ai/deepseek-harness/releases?per_page=1" --jq '.[0]')
          if [ -z "$REL_JSON" ] || [ "$REL_JSON" = "null" ]; then
            echo "error: upstream has no releases" >&2
            exit 1
          fi
          UPSTREAM_TAG=$(jq -r '.tag_name // ""' <<<"$REL_JSON")
          UP_PRE=$(jq -r '.prerelease // false' <<<"$REL_JSON")
          UP_NOTES=$(jq -r '.body // ""' <<<"$REL_JSON")

          # 版本规范化：dsh-v0.1.1-rc.2 → 0.1.1-rc.2；非 dsh-v 前缀则保留原 tag 兜底
          VERSION=$(printf '%s' "$UPSTREAM_TAG" | sed 's/^dsh-v//')
          if [ -z "$VERSION" ]; then
            VERSION="$UPSTREAM_TAG"
          fi
          if [ -n "$OVERRIDE_VERSION" ]; then
            VERSION="$OVERRIDE_VERSION"
            echo "override version: $VERSION"
          fi

          # 上游默认分支（以 API 返回为准，不硬编码 master/HEAD）+ 最新 commit SHA
          DEFAULT_BRANCH=$(gh api "repos/deepseek-ai/deepseek-harness" --jq '.default_branch')
          SHA=$(gh api "repos/deepseek-ai/deepseek-harness/commits/${DEFAULT_BRANCH}" --jq '.sha')
          SHA7=${SHA:0:7}

          # 幂等真相源：本仓库是否已有目标 tag
          HAS_TAG=false
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            HAS_TAG=true
          fi
          DEV_TAG="v${VERSION}-dev-${SHA7}"
          HAS_DEV=false
          if [ "$HAS_TAG" = "true" ] && git ls-remote --tags origin "refs/tags/${DEV_TAG}" | grep -q .; then
            HAS_DEV=true
          fi

          echo "upstream: tag=$UPSTREAM_TAG version=$VERSION prerelease=$UP_PRE sha=$SHA7 branch=$DEFAULT_BRANCH"
          echo "local:    v$VERSION tag=$([ "$HAS_TAG" = "true" ] && echo present || echo missing), dev tag=$([ "$HAS_DEV" = "true" ] && echo present || echo missing)"

          # 决策：手动指定模式 > 上游新 Release（无 v{V} tag）> 上游新 commit（无 dev tag）> force > 无变化
          MODE=""
          if [ "$RELEASE_MODE_INPUT" != "auto" ]; then
            MODE="$RELEASE_MODE_INPUT"
          elif [ "$HAS_TAG" != "true" ]; then
            MODE=version
          elif [ "$HAS_DEV" != "true" ]; then
            MODE=dev
          elif [ "$FORCE" = "true" ]; then
            MODE=version
          fi

          {
            echo "changed=$([ -n "$MODE" ] && echo true || echo false)"
            echo "mode=${MODE:-none}"
            echo "version=$VERSION"
            echo "sha=$SHA"
            echo "upstream_tag=$UPSTREAM_TAG"
            echo "upstream_prerelease=$UP_PRE"
            echo "notes<<UPSTREAM_NOTES_EOF"
            printf '%s\n' "$UP_NOTES"
            echo "UPSTREAM_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: watch
    if: needs.watch.outputs.changed == 'true'
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/build-and-release.yml
    with:
      # poll 通道固定以 main 代码出 v{V}（或其 dev 候选版）；版本与上游引用一并下传
      version: ${{ needs.watch.outputs.version }}
      release_mode: ${{ needs.watch.outputs.mode }}
      upstream_tag: ${{ needs.watch.outputs.upstream_tag }}
      upstream_sha: ${{ needs.watch.outputs.sha }}
      upstream_notes: ${{ needs.watch.outputs.notes }}
      upstream_prerelease: ${{ needs.watch.outputs.upstream_prerelease }}
      ref_to_build: main
      force: ${{ inputs.force }}

  report:
    needs: watch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Poll summary
        env:
          CHANGED: ${{ needs.watch.outputs.changed }}
          MODE: ${{ needs.watch.outputs.mode }}
          VERSION: ${{ needs.watch.outputs.version }}
          SHA: ${{ needs.watch.outputs.sha }}
          UPSTREAM_TAG: ${{ needs.watch.outputs.upstream_tag }}
        run: |
          {
            echo "## 上游巡检结果"
            echo
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 上游 Release tag | \`${UPSTREAM_TAG:-（无）}\` |"
            echo "| 上游默认分支 commit | \`${SHA:0:7}\` |"
            echo "| 发版版本 V | \`${VERSION:-（无）}\` |"
            if [ "$CHANGED" = "true" ]; then
              echo "| 决策 | 触发构建（模式 \`$MODE\`）|"
              echo "| 目标 tag | \`$([ "$MODE" = "dev" ] && echo "v${VERSION}-dev-${SHA:0:7}" || echo "v${VERSION}")\` |"
            else
              echo "| 决策 | ⏭️ 幂等退出（对应 tag 均已存在，无上游变化）|"
            fi
          } >> "$GITHUB_STEP_SUMMARY"